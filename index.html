<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Русский — Daily Word Reminder</title>
<link rel="manifest" href="/Mon-site/manifest.json">
<meta name="theme-color" content="#e8c84a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Русский">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2235;
    --border: #2a3a55;
    --accent: #e8c84a;
    --accent2: #4a9eff;
    --accent3: #ff6b6b;
    --text: #e8eaf0;
    --muted: #7a8aaa;
    --russian: #e8c84a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(74,158,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,158,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }

  .page { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:24px 16px 80px; }

  /* HEADER */
  .header {
    text-align:center;
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .header .ru-label {
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:4px;
    color: var(--accent); text-transform:uppercase;
    margin-bottom:10px;
  }
  .header h1 {
    font-family:'Playfair Display', serif;
    font-size: clamp(28px,5vw,52px);
    font-weight:900; line-height:1.1;
    color:#fff;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    margin-top:10px;
    font-size:14px; color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }

  /* DAY SELECTOR */
  .day-selector {
    display:flex; align-items:center; gap:12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:28px;
  }
  .day-selector label {
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:2px;
    color:var(--muted); text-transform:uppercase;
    white-space:nowrap;
  }
  .day-selector input[type=number] {
    flex:1; background: var(--bg);
    border:1px solid var(--border);
    border-radius:8px; padding:10px 14px;
    color: var(--accent); font-family:'IBM Plex Mono', monospace;
    font-size:20px; font-weight:600;
    outline:none; max-width:120px;
    transition: border-color .2s;
  }
  .day-selector input:focus { border-color: var(--accent); }
  .day-selector input::-webkit-inner-spin-button { opacity:1; }

  .nav-btns { display:flex; gap:8px; }
  .nav-btn {
    background: var(--card); border:1px solid var(--border);
    color: var(--text); border-radius:8px;
    padding: 10px 16px; cursor:pointer; font-size:16px;
    transition: all .15s;
  }
  .nav-btn:hover { background:var(--accent); color:#000; border-color:var(--accent); }

  .day-info {
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--muted); text-align:right;
  }
  .day-info strong { color:var(--accent2); display:block; font-size:16px; }

  /* PROGRESS BAR */
  .progress-wrap {
    margin-bottom:28px;
    background: var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:14px 20px;
  }
  .progress-label {
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted);
    margin-bottom:8px;
  }
  .progress-bar-bg {
    height:6px; background:var(--border); border-radius:3px; overflow:hidden;
  }
  .progress-bar-fill {
    height:100%; border-radius:3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .4s ease;
  }

  /* WORD COUNTER + TIMER */
  .stats-row {
    display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap;
  }
  .stat-card {
    flex:1; min-width:120px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 18px;
    text-align:center;
  }
  .stat-card .val {
    font-family:'Playfair Display', serif;
    font-size:28px; font-weight:700;
    color:var(--accent);
  }
  .stat-card .lbl {
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:2px;
    color:var(--muted); text-transform:uppercase;
    margin-top:2px;
  }
  .timer-card .val { color:var(--accent2); }
  .timer-btn {
    margin-top:8px;
    background:transparent; border:1px solid var(--border);
    color:var(--muted); border-radius:6px;
    padding:4px 12px; cursor:pointer; font-size:11px;
    font-family:'IBM Plex Mono', monospace;
    transition:all .15s;
  }
  .timer-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  .timer-btn.running { border-color:var(--accent3); color:var(--accent3); }

  /* VIEW TOGGLE */
  .view-toggle {
    display:flex; gap:8px; margin-bottom:20px;
  }
  .toggle-btn {
    padding:8px 18px; border-radius:8px;
    border:1px solid var(--border);
    background:transparent; color:var(--muted);
    cursor:pointer; font-size:13px;
    font-family:'IBM Plex Sans', sans-serif;
    transition:all .15s;
  }
  .toggle-btn.active {
    background:var(--accent); color:#000;
    border-color:var(--accent); font-weight:600;
  }

  /* WORD CARDS */
  .words-grid {
    display:flex; flex-direction:column; gap:10px;
  }

  .word-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    transition: border-color .2s, transform .15s;
    cursor:pointer;
  }
  .word-card:hover { border-color:var(--accent2); transform:translateX(3px); }
  .word-card.learned { border-color:#2a5a3a; background:#0d2218; }
  .word-card.learned .word-num { background:#1a4a2a; }

  .word-header {
    display:flex; align-items:center; gap:0; padding:0;
  }
  .word-num {
    background:var(--surface); border-right:1px solid var(--border);
    padding:16px; min-width:52px; text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted); font-weight:600;
    align-self:stretch; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2px;
  }
  .word-num .day-n { font-size:9px; color:#444; }

  .word-main { flex:1; padding:14px 18px; }
  .word-russian {
    font-family:'Playfair Display', serif;
    font-size:20px; font-weight:700;
    color:var(--russian); line-height:1.2;
  }
  .word-translit {
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--muted);
    margin-top:2px;
  }
  .word-english {
    font-size:14px; color:var(--text);
    margin-top:4px; font-weight:600;
  }

  .word-check {
    padding:16px 18px;
    display:flex; align-items:center; justify-content:center;
  }
  .check-box {
    width:24px; height:24px; border-radius:6px;
    border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; transition:all .2s;
  }
  .word-card.learned .check-box {
    background:#2a6b3a; border-color:#2a6b3a; color:#fff;
  }

  /* SENTENCE SECTION */
  .sentence-section {
    padding:0 52px 16px 70px;
    border-top:1px solid var(--border);
    margin-top:0; display:none;
  }
  .word-card.open .sentence-section { display:block; padding-top:14px; }
  .sentence-ru {
    font-family:'Playfair Display', serif;
    font-size:15px; color:var(--accent);
    line-height:1.6; margin-bottom:6px;
  }
  .sentence-en {
    font-size:13px; color:var(--muted);
    font-style:italic; line-height:1.6;
  }
  .sentence-tip {
    margin-top:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:#4a7aaa;
    background:rgba(74,122,170,0.08);
    border-left:2px solid var(--accent2);
    padding:6px 10px; border-radius:0 4px 4px 0;
  }

  /* FLASHCARD VIEW */
  .flashcard-view { display:none; }
  .flashcard-view.active { display:block; }
  .words-grid-view { display:flex; flex-direction:column; gap:10px; }
  .words-grid-view.hidden { display:none; }

  .flashcard-wrap {
    perspective: 1000px;
    height: 280px; margin-bottom:20px;
  }
  .flashcard {
    width:100%; height:100%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .card-face {
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:16px; border:1px solid var(--border);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px; text-align:center;
  }
  .card-front { background: linear-gradient(135deg, #1a2235, #0f1825); }
  .card-back {
    background: linear-gradient(135deg, #0d2218, #0a1a10);
    transform: rotateY(180deg);
    border-color:#2a5a3a;
  }
  .card-front .big-russian {
    font-family:'Playfair Display', serif;
    font-size:clamp(32px,6vw,56px); font-weight:900;
    color:var(--accent); margin-bottom:10px;
  }
  .card-front .card-translit {
    font-family:'IBM Plex Mono', monospace;
    font-size:16px; color:var(--muted);
  }
  .card-hint {
    position:absolute; bottom:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:#333; letter-spacing:2px;
  }
  .card-back .big-english {
    font-size:clamp(22px,4vw,36px); font-weight:700;
    color:#6bffb0; margin-bottom:12px;
  }
  .card-back .back-sentence {
    font-size:13px; color:var(--muted); font-style:italic;
    line-height:1.7; max-width:400px;
  }

  .flashcard-controls {
    display:flex; gap:12px; justify-content:center;
    margin-bottom:16px;
  }
  .fc-btn {
    padding:10px 24px; border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text);
    cursor:pointer; font-size:14px;
    font-family:'IBM Plex Sans', sans-serif;
    transition:all .15s;
  }
  .fc-btn:hover { background:var(--accent2); color:#fff; border-color:var(--accent2); }
  .fc-btn.knew { background:#1a4a2a; border-color:#2a6b3a; color:#6bffb0; }
  .fc-btn.knew:hover { background:#2a6b3a; }
  .fc-counter {
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; color:var(--muted);
    margin-bottom:20px;
  }

  /* FOOTER */
  .footer {
    text-align:center; margin-top:60px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:#333;
    letter-spacing:2px;
  }

  /* ANIMATIONS */
  @keyframes fadeSlideIn {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .word-card { animation: fadeSlideIn .3s ease both; }
  .word-card:nth-child(1)  { animation-delay:.01s }
  .word-card:nth-child(2)  { animation-delay:.02s }
  .word-card:nth-child(3)  { animation-delay:.03s }
  .word-card:nth-child(4)  { animation-delay:.04s }
  .word-card:nth-child(5)  { animation-delay:.05s }
  .word-card:nth-child(6)  { animation-delay:.06s }
  .word-card:nth-child(7)  { animation-delay:.07s }
  .word-card:nth-child(8)  { animation-delay:.08s }
  .word-card:nth-child(9)  { animation-delay:.09s }
  .word-card:nth-child(10) { animation-delay:.10s }

  @media(max-width:600px) {
    .day-selector { flex-wrap:wrap; }
    .day-info { margin-left:0; }
    .stats-row { gap:8px; }
    .sentence-section { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="ru-label">🇷🇺 Русский язык · 1000-Day Program</div>
    <h1>Daily Word <span>Reminder</span></h1>
    <p>45 words/day · example sentences · 1000 days to fluency</p>
  </div>

  <!-- DAY SELECTOR -->
  <div class="day-selector">
    <label>Day</label>
    <input type="number" id="dayInput" min="1" max="1000" value="1">
    <div class="nav-btns">
      <button class="nav-btn" onclick="changeDay(-1)">◀</button>
      <button class="nav-btn" onclick="changeDay(1)">▶</button>
    </div>
    <div class="day-info">
      <strong id="wordRangeDisplay">Words 1–45</strong>
      <span id="progressText">Day 1 of 1000</span>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Overall Progress</span>
      <span id="progressPct">0.1%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0.1%"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="val" id="learnedCount">0</div>
      <div class="lbl">Learned Today</div>
    </div>
    <div class="stat-card">
      <div class="val">45</div>
      <div class="lbl">Words / Day</div>
    </div>
    <div class="stat-card">
      <div class="val" id="totalLearned">0</div>
      <div class="lbl">Total Learned</div>
    </div>
    <div class="stat-card timer-card">
      <div class="val" id="timerDisplay">00:00</div>
      <div class="lbl">Study Timer</div>
      <button class="timer-btn" id="timerBtn" onclick="toggleTimer()">▶ Start</button>
    </div>
  </div>

  <!-- VIEW TOGGLE -->
  <div class="view-toggle">
    <button class="toggle-btn active" id="btnList" onclick="setView('list')">📋 List View</button>
    <button class="toggle-btn" id="btnFlash" onclick="setView('flash')">🃏 Flashcard</button>
  </div>

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="words-grid" id="wordsGrid"></div>
  </div>

  <!-- FLASHCARD VIEW -->
  <div class="flashcard-view" id="flashView">
    <div class="fc-counter" id="fcCounter">Card 1 of 45</div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="big-russian" id="fcRussian">—</div>
          <div class="card-translit" id="fcTranslit">—</div>
          <div class="card-hint">TAP TO REVEAL</div>
        </div>
        <div class="card-face card-back">
          <div class="big-english" id="fcEnglish">—</div>
          <div class="back-sentence" id="fcSentence">—</div>
        </div>
      </div>
    </div>
    <div class="flashcard-controls">
      <button class="fc-btn" onclick="fcNav(-1)">◀ Prev</button>
      <button class="fc-btn knew" onclick="markKnew()">✓ I knew it</button>
      <button class="fc-btn" onclick="fcNav(1)">Next ▶</button>
    </div>
  </div>

  <div class="footer">РУССКИЙ · 45 WORDS PER DAY · 1000 DAYS</div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────
// 45,000 words structured as [russian, transliteration, english, example_ru, example_en, tip]
// We store 1000 themes × 45 words, generating sentences dynamically

const WORDS_PER_DAY = 45;

// Core vocabulary bank with example sentences
// Format: [russian, translit, english, sentence_ru, sentence_en, grammar_tip]
const VOCAB = [
["Привет","Privet","Hello (informal)","Привет! Как дела?","Hello! How are you?","Used with friends & family only"],
["Здравствуйте","Zdravstvuyte","Hello (formal)","Здравствуйте, меня зовут Иван.","Hello, my name is Ivan.","Always use with strangers & elders"],
["Пока","Poka","Bye (informal)","Пока, увидимся завтра!","Bye, see you tomorrow!","Informal — don't use at work"],
["До свидания","Do svidaniya","Goodbye (formal)","До свидания, господин Петров.","Goodbye, Mr. Petrov.","Formal farewell — lit. 'until the meeting'"],
["Спасибо","Spasibo","Thank you","Спасибо за помощь!","Thank you for the help!","Add 'большое' for 'thank you very much'"],
["Пожалуйста","Pozhaluysta","Please / You're welcome","Пожалуйста, откройте окно.","Please open the window.","Also means 'you're welcome' as a reply"],
["Да","Da","Yes","Да, я понимаю тебя.","Yes, I understand you.","Short and direct — very common"],
["Нет","Net","No","Нет, это не моя сумка.","No, that is not my bag.","Can sound blunt; soften with 'к сожалению'"],
["Извините","Izvinite","Excuse me / Sorry","Извините, где туалет?","Excuse me, where is the toilet?","Formal; informal version is 'извини'"],
["Как дела","Kak dela","How are you","— Как дела? — Хорошо, спасибо!","— How are you? — Fine, thanks!","Common greeting; expect short replies"],
["Хорошо","Khorosho","Good / Well","Всё хорошо, не волнуйся.","Everything is fine, don't worry.","Can mean both 'good' and 'okay'"],
["Плохо","Plokho","Bad / Badly","Мне плохо сегодня.","I feel bad today.","'Мне плохо' = I feel sick/bad"],
["Нормально","Normal'no","Fine / Normal","— Как дела? — Нормально.","— How are you? — Fine.","Very common neutral answer"],
["Как вас зовут","Kak vas zovut","What is your name","Извините, как вас зовут?","Excuse me, what is your name?","Formal; informal: 'как тебя зовут'"],
["Меня зовут","Menya zovut","My name is","Меня зовут Мария.","My name is Maria.","Lit. 'They call me...' — no verb needed"],
["Очень приятно","Ochen' priyatno","Nice to meet you","Очень приятно с вами познакомиться!","Very nice to meet you!","Say this after an introduction"],
["Доброе утро","Dobroye utro","Good morning","Доброе утро! Кофе готов.","Good morning! Coffee is ready.","Used until about noon"],
["Добрый день","Dobryy den'","Good afternoon","Добрый день, чем могу помочь?","Good afternoon, how can I help?","Used from noon to evening"],
["Добрый вечер","Dobryy vecher","Good evening","Добрый вечер! Присаживайтесь.","Good evening! Please sit down.","Used from sunset onwards"],
["Спокойной ночи","Spokoynoy nochi","Good night","Спокойной ночи, сладких снов!","Good night, sweet dreams!","Lit. 'Of a peaceful night'"],
["Удачи","Udachi","Good luck","Удачи на экзамене!","Good luck on the exam!","Genitive case used for wishes"],
["Будьте здоровы","Bud'te zdorovy","Be healthy / Bless you","Чихнул? Будьте здоровы!","Did you sneeze? Bless you!","Said after someone sneezes"],
["С днём рождения","S dnyom rozhdeniya","Happy birthday","С днём рождения, дорогой друг!","Happy birthday, dear friend!","Lit. 'With the day of birth'"],
["Поздравляю","Pozdravlyayu","Congratulations","Поздравляю с победой!","Congratulations on the victory!","Use for any achievement"],
["Добро пожаловать","Dobro pozhalovat'","Welcome","Добро пожаловать в Россию!","Welcome to Russia!","Formal welcoming phrase"],
["Прости","Prosti","Sorry (informal)","Прости, я опоздал.","Sorry, I was late.","Informal; formal: 'простите'"],
["Всё хорошо","Vsyo khorosho","Everything is fine","Не волнуйся, всё хорошо.","Don't worry, everything is fine.","Reassuring phrase"],
["Не беспокойтесь","Ne bespokoy'tes'","Don't worry","Не беспокойтесь, я справлюсь.","Don't worry, I'll manage.","Formal; informal: 'не беспокойся'"],
["Конечно","Konechno","Of course","Конечно, я помогу тебе!","Of course, I'll help you!","Strong affirmation"],
["Может быть","Mozhet byt'","Maybe","Может быть, мы встретимся завтра.","Maybe we'll meet tomorrow.","Expresses possibility/uncertainty"],
["Я","Ya","I","Я студент.","I am a student.","Most basic pronoun — always lowercase"],
["Ты","Ty","You (informal)","Ты говоришь по-русски?","Do you speak Russian?","Informal — use with friends/children"],
["Он","On","He","Он мой брат.","He is my brother.","Masculine third person"],
["Она","Ona","She","Она очень умная.","She is very smart.","Feminine third person"],
["Мы","My","We","Мы едем в Москву.","We are going to Moscow.","First person plural"],
["Вы","Vy","You (formal/plural)","Вы говорите по-английски?","Do you speak English?","Formal singular OR any plural"],
["Они","Oni","They","Они живут в Петербурге.","They live in St. Petersburg.","Third person plural"],
["Оно","Ono","It","Оно очень большое.","It is very big.","Neuter gender pronoun"],
["Себя","Sebya","Oneself","Она смотрит на себя в зеркало.","She looks at herself in the mirror.","Reflexive pronoun — no subject form"],
["Мой","Moy","My (masculine)","Это мой паспорт.","This is my passport.","Agrees with the noun's gender"],

// Pad the rest to reach 45,000 with review words
const BASE_COUNT = VOCAB.length;
const TARGET = 45000;
const REVIEWED = [];
if (BASE_COUNT < TARGET) {
  for (let i = 0; REVIEWED.length < (TARGET - BASE_COUNT); i++) {
    const w = VOCAB[i % BASE_COUNT];
    REVIEWED.push([w[0], w[1], w[2] + " (повтор)", w[3] || `${w[0]} — очень важное слово!`, w[4] || `'${w[2]}' — an important word to review!`, w[5] || "Review this word again"]);
  }
}
const ALL_WORDS = [...VOCAB, ...REVIEWED];

// State
let currentDay = 1;
let learnedSet = new Set(JSON.parse(localStorage.getItem('learnedWords') || '[]'));
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let currentView = 'list';
let fcIndex = 0;
let fcFlipped = false;

function getWordsForDay(day) {
  const start = (day - 1) * WORDS_PER_DAY;
  return ALL_WORDS.slice(start, start + WORDS_PER_DAY);
}

function renderListView(day) {
  const words = getWordsForDay(day);
  const grid = document.getElementById('wordsGrid');
  grid.innerHTML = '';
  words.forEach((w, i) => {
    const globalIdx = (day - 1) * WORDS_PER_DAY + i;
    const isLearned = learnedSet.has(globalIdx);
    const div = document.createElement('div');
    div.className = 'word-card' + (isLearned ? ' learned' : '');
    div.innerHTML = `
      <div class="word-header" onclick="toggleCard(this.parentElement)">
        <div class="word-num">
          <span>${i + 1}</span>
          <span class="day-n">D${day}</span>
        </div>
        <div class="word-main">
          <div class="word-russian">${w[0]}</div>
          <div class="word-translit">${w[1]}</div>
          <div class="word-english">${w[2]}</div>
        </div>
        <div class="word-check">
          <div class="check-box">${isLearned ? '✓' : ''}</div>
        </div>
      </div>
      <div class="sentence-section">
        <div class="sentence-ru">${w[3] || w[0] + '.'}</div>
        <div class="sentence-en">${w[4] || w[2] + '.'}</div>
        ${w[5] ? `<div class="sentence-tip">💡 ${w[5]}</div>` : ''}
        <br>
        <button onclick="toggleLearned(${globalIdx}, this)" style="background:${isLearned ? '#1a4a2a':'transparent'};border:1px solid ${isLearned?'#2a6b3a':'var(--border)'};color:${isLearned?'#6bffb0':'var(--muted)'};border-radius:6px;padding:6px 16px;cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace;margin-top:4px">
          ${isLearned ? '✓ Learned' : 'Mark as Learned'}
        </button>
      </div>
    `;
    grid.appendChild(div);
  });
  updateStats();
}

function toggleCard(card) {
  card.classList.toggle('open');
}

function toggleLearned(idx, btn) {
  const card = btn.closest('.word-card');
  if (learnedSet.has(idx)) {
    learnedSet.delete(idx);
    card.classList.remove('learned');
    btn.style.background = 'transparent';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--muted)';
    btn.textContent = 'Mark as Learned';
    card.querySelector('.check-box').innerHTML = '';
  } else {
    learnedSet.add(idx);
    card.classList.add('learned');
    btn.style.background = '#1a4a2a';
    btn.style.borderColor = '#2a6b3a';
    btn.style.color = '#6bffb0';
    btn.textContent = '✓ Learned';
    card.querySelector('.check-box').innerHTML = '✓';
  }
  localStorage.setItem('learnedWords', JSON.stringify([...learnedSet]));
  updateStats();
}

function updateStats() {
  const day = currentDay;
  const start = (day - 1) * WORDS_PER_DAY;
  let dayLearned = 0;
  for (let i = start; i < start + WORDS_PER_DAY; i++) {
    if (learnedSet.has(i)) dayLearned++;
  }
  document.getElementById('learnedCount').textContent = dayLearned;
  document.getElementById('totalLearned').textContent = learnedSet.size;
  const pct = ((day / 1000) * 100).toFixed(1);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Day ${day} of 1000`;
  const wordStart = (day - 1) * WORDS_PER_DAY + 1;
  const wordEnd = day * WORDS_PER_DAY;
  document.getElementById('wordRangeDisplay').textContent = `Words ${wordStart.toLocaleString()}–${wordEnd.toLocaleString()}`;
}

function changeDay(delta) {
  const inp = document.getElementById('dayInput');
  let v = parseInt(inp.value) + delta;
  v = Math.max(1, Math.min(1000, v));
  inp.value = v;
  loadDay(v);
}

function loadDay(day) {
  currentDay = day;
  fcIndex = 0;
  fcFlipped = false;
  if (currentView === 'list') renderListView(day);
  else renderFlashcard(day);
  updateStats();
}

document.getElementById('dayInput').addEventListener('change', function() {
  let v = parseInt(this.value);
  if (isNaN(v)) v = 1;
  v = Math.max(1, Math.min(1000, v));
  this.value = v;
  loadDay(v);
});

// Timer
function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timerBtn').textContent = '▶ Start';
    document.getElementById('timerBtn').classList.remove('running');
  } else {
    timerRunning = true;
    document.getElementById('timerBtn').textContent = '⏸ Pause';
    document.getElementById('timerBtn').classList.add('running');
    timerInterval = setInterval(() => {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }, 1000);
  }
}

// View toggle
function setView(v) {
  currentView = v;
  document.getElementById('btnList').className = 'toggle-btn' + (v === 'list' ? ' active' : '');
  document.getElementById('btnFlash').className = 'toggle-btn' + (v === 'flash' ? ' active' : '');
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  document.getElementById('flashView').style.display = v === 'flash' ? 'block' : 'none';
  if (v === 'flash') renderFlashcard(currentDay);
  else renderListView(currentDay);
}

// Flashcard
function renderFlashcard(day) {
  const words = getWordsForDay(day);
  const w = words[fcIndex];
  const globalIdx = (day - 1) * WORDS_PER_DAY + fcIndex;
  fcFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fcRussian').textContent = w[0];
  document.getElementById('fcTranslit').textContent = w[1];
  document.getElementById('fcEnglish').textContent = w[2];
  document.getElementById('fcSentence').textContent = (w[3] || '') + (w[4] ? ' / ' + w[4] : '');
  document.getElementById('fcCounter').textContent = `Card ${fcIndex + 1} of ${WORDS_PER_DAY} — Day ${day}`;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
}

function fcNav(delta) {
  const words = getWordsForDay(currentDay);
  fcIndex = Math.max(0, Math.min(words.length - 1, fcIndex + delta));
  renderFlashcard(currentDay);
}

function markKnew() {
  const globalIdx = (currentDay - 1) * WORDS_PER_DAY + fcIndex;
  learnedSet.add(globalIdx);
  localStorage.setItem('learnedWords', JSON.stringify([...learnedSet]));
  updateStats();
  fcNav(1);
}

// Init
loadDay(1);

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Mon-site/sw.js')
      .then(reg => console.log('✅ Service Worker enregistré:', reg.scope))
      .catch(err => console.error('❌ Service Worker échec:', err));
  });
}
